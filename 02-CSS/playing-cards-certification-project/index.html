<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <main id="playing-cards">
        <div class="card">
            <div class="left spade"><span>A</span>
                <span>♠</span>
            </div>
            <div class="middle spade">♠</div>
            <div class="right spade"><span>A</span>
                <span>♠</span>
            </div>
        </div>
        <div class="card">
            <div class="left diamond"><span>A</span>
                <span>♦</span>
            </div>
            <div class="middle diamond">♦</div>
            <div class="right diamond"><span>A</span>
                <span>♦</span>
            </div>
        </div>
        <div class="card">
            <div class="left club"><span>A</span>
                <span>♣</span>
            </div>
            <div class="middle club">♣</div>
            <div class="right club"><span>A</span>
                <span>♣</span>
            </div>
        </div>
        <div class="card">
            <div class="left heart"><span>A</span>
                <span>♥</span>
            </div>
            <div class="middle heart">♥</div>
            <div class="right heart"><span>A</span>
                <span>♥</span>
            </div>
        </div>
    </main>
</body>

</html>
