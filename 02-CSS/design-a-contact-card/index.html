<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <div class="form-container">
        <form>
            <h2>Contact Us</h2>
            <label for="name">Full Name: <input id="name" name="name" type="text" required /></label>
            <label for="email">Email: <input type="email" id="email" name="email" required /></label>
            <label for="reason">Please tell us why you are reaching out: <textarea id="reason" name="reason"
                    required /></textarea></label>
            <button type="submit" value="Submit">Submit</button>
        </form>
    </div>
</body>

</html>
