<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <div class="container">
        <form>
            <label for="name">Full Name: </label>
            <input type="text" id="name" placeholder="John Doe" name="name" required />

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required />

            <label for="position">Position Applying For: </label>
            <select id="position" name="position" required>
                <option value="" disabled selected>--Select A Position--</option>
                <option value="fry-cook">Fry Cook</option>
                <option value="sous-chef">Sous Chef</option>
                <option value="head-chef">Head Chef</option>
                <option value="kitchen-manager">Kitchen Manager</option>
                <option value="waiter">Waiter</option>
            </select>

            <fieldset class="radio-group">
                <legend>Availability</legend>

                <input type="radio" id="full-time" name="availability" value="full-time" required />
                <label for="full-time">Full Time</label>

                <input type="radio" id="part-time" name="availability" value="part-time" />
                <label for="part-time">Part Time</label>
            </fieldset>

            <label for="message">Why do you want to work here?</label>
            <textarea id="message" name="message" placeholder="I love food." required></textarea>

            <button type="submit" id="submit-btn" name="submit-btn">Submit Application</button>
        </form>
    </div>
</body>

</html>
