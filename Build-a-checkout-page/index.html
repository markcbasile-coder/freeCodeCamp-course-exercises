<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"
            alt="a rubiks cube that in mixed up with layers not lined up." />
        <caption>Rubiks Cube</caption>
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name"><span aria-hidden="true">*</span>Card Name</label>
            <input id="card-name" name="card-name" type="text" required />
            <br />
            <label for="card-number"><span aria-hidden="true">*</span> Card Number</label>
            <input id="card-number" name="card-number" type="text" aria-describedby="card-number-help" required />
            <p id="card-number-help">Please put in your card number in a single string of numbers, no dashes.</p>
        </form>
    </section>


</body>

</html>
